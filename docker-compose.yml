services:
  corsproxy:
    build: .
    ports:
      - "3080:3080"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3080
      - STATS_FILE=/app/data/stats.json
      #- STATS_IGNORE=favicon.ico,apple-touch-icon.png,robots.txt
      # Optional: public URL (e.g. behind reverse proxy with HTTPS)
      #- BASE_URL=https://cors.hibbit.cloud
    restart: unless-stopped
